version: '3.8'

services:
  streamlit-demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    container_name: napoleon-demo
    ports:
      - "8501:8501"
    volumes:
      - ./audio:/app/audio
      - ./results:/app/results
      - ./dataset:/app/dataset
      - ./transcriptions:/app/transcriptions
    environment:
      # Scaleway
      SCALEWAY_API_KEY: ${SCW_API_KEY:-}
      SCALEWAY_PROJECT_ID: ${SCALEWAY_PROJECT_ID:-}
      SCALEWAY_REGION: ${SCALEWAY_REGION:-fr-par}
      SCALEWAY_MODEL: ${SCALEWAY_MODEL:-whisper-large}
      
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      # Anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      
      # Posos
      POSOS_API_KEY: ${POSOS_API_KEY:-}
      
      # Streamlit config
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_LOGGER_LEVEL: "info"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - napoleon
    restart: unless-stopped

networks:
  napoleon:
    driver: bridge
