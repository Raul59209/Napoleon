services:
  napoleon-demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    container_name: napoleon-demo
    ports:
      - "8501:8501"
    volumes:
      - ./audio:/app/audio
      - ./results:/app/results
      - ./dataset:/app/dataset
      - hf-cache:/root/.cache/huggingface
      - whisper-cache:/root/.cache/whisper
    env_file:
      - .env
    environment:
      - SCW_API_KEY=${SCW_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  hf-cache:
  whisper-cache: